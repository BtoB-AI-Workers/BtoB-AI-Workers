[project]
name = "line-slack-agent"
version = "0.1.0"
description = "LINE↔Slack連携Bot経由で案件投稿・候補者返信を自動化するエージェント"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.19",
    "slack-sdk>=3.27",
    "anthropic>=0.40",
    "gspread>=6.0",
    "google-auth>=2.29",
    "filelock>=3.13",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-branch --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
